{% if messages %}
<div class="row mb-3">
  <div class="col-12">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show" role="alert">
      {% if message.tags == 'success' %}<i class="ph ph-check-circle me-2"></i>
      {% elif message.tags == 'error' or message.tags == 'danger' %}<i class="ph ph-x-circle me-2"></i>
      {% elif message.tags == 'warning' %}<i class="ph ph-warning me-2"></i>
      {% else %}<i class="ph ph-info me-2"></i>{% endif %}
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
